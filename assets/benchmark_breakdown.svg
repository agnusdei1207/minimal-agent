  <!-- Footer Tagline -->
  <rect x="24" y="367" width="792" height="20" rx="4" fill="#0B0E12" />
  <text x="36" y="381" fill="#C8FF00" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="bold">INSIGHT:</text>
  <text x="96" y="381" fill="#7A889B" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10">DeepSeek pulls ahead on Level 2 (+6%p) and Level 3 (+13%p) complex state / multi-step token exploits.</text>
