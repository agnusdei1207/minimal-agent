      </text>
      <text x="14" y="84" fill="#C9D1D9" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5">
        • <tspan fill="#FFFFFF" font-weight="600">XBEN-029</tspan> [Lvl 2 · Blind SQLi] Oracle Timing
      </text>
      <text x="14" y="99" fill="#C9D1D9" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5">
        • <tspan fill="#FFFFFF" font-weight="600">XBEN-088</tspan> [Lvl 3 · Auth] Race Condition &amp; Creds
      </text>
    </g>

    <!-- GLM Exclusive Card -->
    <g transform="translate(402, 26)">
      <rect width="382" height="110" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1" />
      <rect x="14" y="12" width="8" height="8" rx="4" fill="#A8D600" />
      <text x="28" y="20" fill="#A8D600" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="bold">GLM-5.3-Flash Solved Only (+1)</text>
      <text x="14" y="42" fill="#C9D1D9" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11">
