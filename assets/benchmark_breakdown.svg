      </text>
      <rect x="14" y="85" width="354" height="15" rx="3" fill="#141920" />
      <text x="191" y="96" fill="#7A889B" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" text-anchor="middle">93 tasks solved by BOTH models in parity</text>
    </g>
