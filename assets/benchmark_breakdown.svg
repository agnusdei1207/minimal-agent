      <rect x="230" y="0" width="403" height="7" rx="3" fill="url(#neonBar)" filter="url(#neonGlow)" />
      <text x="702" y="7" fill="#C8FF00" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="bold">88%</text>
      <text x="734" y="7" fill="#7A889B" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10">(7/8)</text>

      <!-- GLM Bar: 6/8 = 75.0% -> 345px -->
      <rect x="230" y="11" width="460" height="7" rx="3" fill="#141920" />
      <rect x="230" y="11" width="345" height="7" rx="3" fill="#A8D600" opacity="0.8" />
      <text x="702" y="18" fill="#A8D600" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11">75%</text>
      <text x="734" y="18" fill="#7A889B" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10">(6/8)</text>
