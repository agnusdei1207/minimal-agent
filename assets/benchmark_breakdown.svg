<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 395" width="100%" height="auto">
  <defs>
    <linearGradient id="neonBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8FF00" />
      <stop offset="100%" stop-color="#E2FF66" />
    </linearGradient>
    <linearGradient id="glmBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B9E00" />
      <stop offset="100%" stop-color="#A8D600" />
    </linearGradient>
    <filter id="neonGlow" x="-10%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#C8FF00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="840" height="395" rx="12" fill="#080A0D" stroke="#1E2631" stroke-width="1.5" />

  <!-- Header -->
  <circle cx="32" cy="32" r="5" fill="#C8FF00" filter="url(#neonGlow)" />
  <text x="48" y="36" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="bold" letter-spacing="1.5">XBOW-104 · DIFFICULTY &amp; EXPLOIT DOMAIN MATRIX</text>
  <rect x="710" y="21" width="102" height="22" rx="11" fill="#141920" stroke="#C8FF00" stroke-width="0.8" />
  <text x="761" y="35" fill="#C8FF00" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="bold" text-anchor="middle">LEVEL BREAKDOWN</text>

  <!-- Divider -->
  <line x1="24" y1="52" x2="816" y2="52" stroke="#171D25" stroke-width="1" />

  <!-- SECTION 1: DIFFICULTY COMPARISON (Top Half) -->
  <g transform="translate(28, 62)">
    <text x="0" y="16" fill="#7A889B" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1">SOLVE RATE BY CHALLENGE DIFFICULTY</text>

    <!-- Legend -->
    <rect x="570" y="6" width="10" height="10" rx="2" fill="#C8FF00" />
    <text x="586" y="15" fill="#F0F6FC" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11">DeepSeek-V4-Flash</text>
    <rect x="715" y="6" width="10" height="10" rx="2" fill="#A8D600" />
    <text x="731" y="15" fill="#7A889B" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11">GLM-5.3-Flash</text>

    <!-- Level 1 (Easy - 45 tasks) -->
    <g transform="translate(0, 30)">
      <text x="0" y="12" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="bold">Level 1 (Easy · 45 tasks)</text>
      <!-- DeepSeek Bar -->
      <rect x="230" y="0" width="460" height="7" rx="3" fill="#141920" />
      <rect x="230" y="0" width="451" height="7" rx="3" fill="url(#neonBar)" filter="url(#neonGlow)" />
      <text x="702" y="7" fill="#C8FF00" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="bold">98%</text>
      <text x="734" y="7" fill="#7A889B" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10">(44/45)</text>

      <!-- GLM Bar -->
      <rect x="230" y="11" width="460" height="7" rx="3" fill="#141920" />
      <rect x="230" y="11" width="451" height="7" rx="3" fill="#A8D600" opacity="0.8" />
      <text x="702" y="18" fill="#A8D600" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11">98%</text>
      <text x="734" y="18" fill="#7A889B" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10">(44/45)</text>
