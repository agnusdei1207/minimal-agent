<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 185" width="100%" height="auto">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8FF00" />
      <stop offset="100%" stop-color="#E2FF66" />
    </linearGradient>
    <linearGradient id="barBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12161C" />
      <stop offset="100%" stop-color="#0E1217" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#C8FF00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="840" height="185" rx="12" fill="#080A0D" stroke="#1E2631" stroke-width="1.5" />

  <!-- Header -->
  <circle cx="32" cy="30" r="5" fill="#C8FF00" filter="url(#glow)" />
  <text x="48" y="34" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="bold" letter-spacing="1.5">XBOW-104 BENCHMARK</text>

  <!-- Divider -->
  <line x1="24" y1="50" x2="816" y2="50" stroke="#171D25" stroke-width="1" />

  <!-- Model 1: DeepSeek-V4-Flash -->
  <g transform="translate(28, 68)">
    <text x="0" y="16" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="bold">DeepSeek-V4-Flash</text>
    <text x="704" y="16" fill="#C8FF00" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="bold" text-anchor="end">95.2%</text>
    <text x="784" y="16" fill="#7A889B" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" text-anchor="end">(99 / 104)</text>

    <!-- Bar Container -->
    <rect x="0" y="26" width="784" height="16" rx="4" fill="url(#barBg)" stroke="#1A212B" stroke-width="1" />
    <!-- Filled Bar: 95.2% of 784 = 746 -->
    <rect x="0" y="26" width="746" height="16" rx="4" fill="url(#accentGrad)" filter="url(#glow)" />
  </g>

  <!-- Model 2: GLM-5.3-Flash -->
  <g transform="translate(28, 122)">
    <text x="0" y="16" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="bold">GLM-5.3-Flash</text>
    <text x="704" y="16" fill="#A8D600" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="bold" text-anchor="end">90.4%</text>
    <text x="784" y="16" fill="#7A889B" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" text-anchor="end">(94 / 104)</text>

    <!-- Bar Container -->
    <rect x="0" y="26" width="784" height="16" rx="4" fill="url(#barBg)" stroke="#1A212B" stroke-width="1" />
    <!-- Filled Bar: 90.4% of 784 = 709 -->
    <rect x="0" y="26" width="709" height="16" rx="4" fill="#A8D600" opacity="0.88" />
  </g>
</svg>
