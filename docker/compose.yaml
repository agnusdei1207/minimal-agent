services:
  pentesting:
    image: agnusdei1207/pentesting:0.200.1
    stdin_open: true
    tty: true
    # Raw sockets for SYN scans, masscan, and packet capture (INTENT-0003: 사전 탑재 + cap 계약).
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # Fixed local provider config lives in the gitignored repo-root .env.
    env_file:
      - ../.env
    volumes:
      - ../workspace:/workspace
      - ../runs:/state
    command:
      - run
      - --goal
      - ${PENTESTING_GOAL:-Help complete the requested task}
      - --workspace
      - /workspace
      - --run
      - /state/current
