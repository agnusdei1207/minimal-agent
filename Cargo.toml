[package]
name = "pentesting"
version = "0.200.0"
edition = "2024"
rust-version = "1.98"
description = "A small autonomous team-agent runtime written in Rust"
license = "MIT"
repository = "https://github.com/agnusdei1207/pentesting"
homepage = "https://github.com/agnusdei1207/pentesting"

[lib]
name = "minimal_agent"
path = "src/lib.rs"

[[bin]]
name = "pentesting"
path = "src/main.rs"



[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
eventsource-stream = "0.2"
fs2 = "0.4"
futures = "0.3"
hex = "0.4"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
