<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 370" width="1680" height="370">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8FF00" />
      <stop offset="100%" stop-color="#E2FF66" />
    </linearGradient>
    <linearGradient id="barBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12161C" />
      <stop offset="100%" stop-color="#0E1217" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#C8FF00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="1680" height="370" rx="24" fill="#080A0D" stroke="#1E2631" stroke-width="2" />

  <!-- Header -->
  <circle cx="64" cy="60" r="10" fill="#C8FF00" filter="url(#glow)" />
  <text x="96" y="68" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="26" font-weight="bold" letter-spacing="2">XBOW-104 BENCHMARK</text>

  <!-- Divider -->
  <line x1="48" y1="100" x2="1632" y2="100" stroke="#171D25" stroke-width="2" />

  <!-- Model 1: DeepSeek-V4-Flash -->
  <g transform="translate(56, 136)">
    <text x="0" y="32" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="28" font-weight="bold">DeepSeek-V4-Flash</text>
    <text x="1408" y="32" fill="#C8FF00" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="30" font-weight="bold" text-anchor="end">95.2%</text>
    <text x="1568" y="32" fill="#7A889B" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="26" text-anchor="end">(99 / 104)</text>

    <!-- Bar Container -->
    <rect x="0" y="52" width="1568" height="32" rx="8" fill="url(#barBg)" stroke="#1A212B" stroke-width="2" />
    <!-- Filled Bar: 95.2% of 1568 = 1493 -->
    <rect x="0" y="52" width="1493" height="32" rx="8" fill="url(#accentGrad)" filter="url(#glow)" />
  </g>

  <!-- Model 2: GLM-5.3-Flash -->
  <g transform="translate(56, 244)">
    <text x="0" y="32" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="28" font-weight="bold">GLM-5.3-Flash</text>
    <text x="1408" y="32" fill="#A8D600" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="30" font-weight="bold" text-anchor="end">90.4%</text>
    <text x="1568" y="32" fill="#7A889B" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="26" text-anchor="end">(94 / 104)</text>

    <!-- Bar Container -->
    <rect x="0" y="52" width="1568" height="32" rx="8" fill="url(#barBg)" stroke="#1A212B" stroke-width="2" />
    <!-- Filled Bar: 90.4% of 1568 = 1417 -->
    <rect x="0" y="52" width="1417" height="32" rx="8" fill="#A8D600" opacity="0.88" />
  </g>
</svg>
